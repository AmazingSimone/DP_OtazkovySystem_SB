services:
    proxy:
        restart: always
        depends_on:
            - frontend
            - backend
        build:
            dockerfile: Dockerfile.dev
            context: ./apps/nginx
        ports:
            - '3000:80'
    backend:
        build:
            context: ./apps/backend
            dockerfile: Dockerfile.dev
        depends_on:
            mongo:
                condition: service_healthy
        volumes:
            - ./apps/backend/:/usr/src/app
            - /usr/src/app/.pnpm-store
            - /usr/src/app/node_modules
        command: pnpm run dev
        environment:
            MONGO_DATABASE_URL2: mongodb://mongo:27017/otazkovySystem
            MONGO_DATABASE_URL: mongodb://mongoUser:hatatitla123*+465@mongo:27017/otazkovySystem?authSource=admin
            TOKEN_KEY: e3c9cfe5c8c1ceab90b84e56f1ce8d8e0fcd9485
            SALT_KEY: e3f38a23a13c8fe9b83f9fdf33cd9a7f7ef9b21de88b1f7b2c1efb9f1094ccf0
            PORT: 5000
            SMTP_HOST: ${SMTP_HOST}
            SMTP_PORT: ${SMTP_PORT}
            SMTP_SECURE: ${SMTP_SECURE}
            SMTP_USER: ${SMTP_USER}
            SMTP_PASS: ${SMTP_PASS}
            SMTP_FROM: ${SMTP_FROM}
            FRONTEND_URL: ${FRONTEND_URL}
    frontend:
        build:
            context: ./apps/frontend
            dockerfile: Dockerfile.dev
        volumes:
            - ./apps/frontend:/usr/src/app
            - /usr/src/app/node_modules
        environment:
            - CHOKIDAR_USEPOLLING=true  
    mongo:
        image: 'mongo'
        command: mongod --auth --logpath /dev/null
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        environment:
            - MONGO_INITDB_DATABASE=otazkovySystem
            - MONGO_INITDB_ROOT_USERNAME=mongoUser
            - MONGO_INITDB_ROOT_PASSWORD=hatatitla123*+465
        volumes:
            - ./volumes/backups:/backup:ro
            - ./volumes/backend:/data/db
            - ./apps/entry_point/api-mongo-init.js:/docker-entrypoint-initdb.d/api-mongo-init.js:ro
        ports:
            # change of mongo db port from 29029 to 29035 bcs of conflict with other service
            - '29035:27017'
